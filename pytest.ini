[pytest]
markers =
    slow: chậm (chạy CLI thật, sinh DOCX) — bỏ qua bằng: pytest -m "not slow"
# `tdm-client/` là bản clone CỤC BỘ của WileyLabs/tdm-client (git bỏ qua, CI không có). 47 test của nó đòi
# TDM_API_TOKEN ⇒ chạy pytest trên máy báo lỗi giả mà CI không thấy. Bỏ qua để lượt chạy máy khớp CI (27/09/2026).
addopts = --ignore=tdm-client
