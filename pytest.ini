[pytest]
markers =
    slow: chậm (chạy CLI thật, sinh DOCX) — bỏ qua bằng: pytest -m "not slow"
# `tdm-client/` là bản clone CỤC BỘ của WileyLabs/tdm-client (git bỏ qua, CI không có). 47 test của nó đòi
# TDM_API_TOKEN ⇒ chạy pytest trên máy báo lỗi giả mà CI không thấy. Bỏ qua để lượt chạy máy khớp CI (27/09/2026).
# `medical-ebm-automation/` lồng bên trong repo = bản clone thứ hai của chính repo (25/10/2026): pytest thu thập trùng
# tests/conftest.py ⇒ ImportPathMismatchError, cả lượt dừng ở bước thu thập (3 lỗi). CI clone sạch nên không thấy.
addopts = --ignore=tdm-client --ignore=medical-ebm-automation
