## 🤖 BƯỚC TIẾP THEO — HIỆN THỰC HÓA THÀNH CRF THẬT (G5 FULL AUTO)

Sau khi bác sĩ/agent này đã **chốt bộ biến số** (PHẦN 1–7 ở trên), bước TIẾP THEO để biến bộ biến này thành **CRF/data dictionary thật** là chạy:
```bash
python medical-ebm-automation/tools/run_g5_auto.py --study "MA-DE-TAI"
```
Lưu ý: CLI thật của `run_g5_auto.py` **CHỈ nhận `--study STUDY`**, không có tham số khác — script **KHÔNG** nhận trực tiếp bộ biến vừa đặc tả ở đây làm input; nó **tự đọc topic từ G0 checkpoint** và **tự suy luận chuyên khoa/biến** để sinh CRF (số dòng biến động theo thiết kế/chuyên khoa nhận diện — KHÔNG cố định 55 dòng như docstring lịch sử của script ghi, đã kiểm chứng chạy thật 2026-07-11) + data dictionary + script Python. Vì vậy bộ biến do agent này soạn vẫn cần được bác sĩ đối chiếu thủ công với CRF do `run_g5_auto.py` sinh ra (cổng G5, agent `quan-ly-du-lieu`) để bảo đảm không thiếu/thừa biến so với bản đặc tả này.

## Đồng bộ xuyên cổng (15/11/2026 — bác sĩ duyệt)

> Vì sao: giả lập trung thực (hệ TỰ sinh từ G0/G1, không viết sẵn bộ biến/SAP) cho thấy mục tiêu ↔ biến ↔ công cụ ↔ từ điển ↔ SAP ↔ SPSS/R không có phép kiểm máy; SPSS/R báo «✓ khớp» trên bộ biến SAI. Báo cáo: `audit/kiem-dong-bo-xuyen-cong-20261115.md` (repo gốc). Công cụ chung: `tools/ma_tran_muc_tieu_bien.py` (repo y khoa). «Khớp khứ hồi/khớp từ điển» KHÔNG chứng minh biến đúng mục tiêu.

- Đầu ra G3-T2 là HAI tệp: `_bo-bien-rieng.csv` + `_ma-tran-muc-tieu-bien.csv` (cột `muc_tieu, khai_niem, vai_tro, bien, kieu, cau_hoi, cong_cu, phan_tich_sap, ghi_chu`; `vai_tro` ∈ ket_cuc_chinh · ket_cuc_phu · phoi_nhiem · yeu_to · hiep_bien · phan_tang · thoi_gian · su_kien · mo_ta · cum · trong_so; `kieu` ∈ nhi_phan · danh_dinh · thu_tu · lien_tuc · dem · ngay · thoi_gian_den_su_kien · van_ban).
- Dựng khung từ mục tiêu G1: `python tools/ma_tran_muc_tieu_bien.py mau --study <mã> --ghi` (mỗi yếu tố mục tiêu liệt kê một dòng, `bien = [CẦN]`), rồi điền. Luật máy: MỌI yếu tố mục tiêu nêu phải có biến (MT-04); ĐÚNG một `ket_cuc_chinh`, `kieu` khớp loại dữ liệu chốt ở G1 (MT-05); biến có trong bộ biến (MT-06); trường số phải có kiểm `integer/number`, nhị phân phải là radio/yesno 2 lựa chọn — không phải `text` (MT-07); biến phái sinh có `bien_nguon` thật + người duyệt (MT-08).
- Tổng quan/gộp (15/11/2026): phiếu trích xuất khai kết cục chính ở CẤP NGHIÊN CỨU từng nhánh — nhiều dòng `ket_cuc_chinh` kiểu `dem`/`lien_tuc` (vd `bien_co_can_thiep`, `bien_co_chung`) là đúng khuôn (MT-05). Nhật ký `audit/nhat-ky/2026-11-15-gia-lap-8-thiet-ke-dau-chuoi.md`.
- Xong chỉ khi `python tools/ma_tran_muc_tieu_bien.py kiem --study <mã>` mã 0 (G3-AUTO-19). Mã câu (`cau_hoi`) phải trùng mã trên phiếu nộp Hội đồng Đạo đức (G5-AUTO-13).
- Thiếu bộ biến riêng ⇒ G5 DỪNG (không còn rơi về bộ mẫu chung). `_GOI_Y_bo-bien-tu-bo-mau.csv` chỉ là GỢI Ý NHÁP — không chép thành bộ biến khi chưa đối chiếu từng mục tiêu.
- `bhyt`/`co_bhyt` (có BHYT, loại thẻ) là biến tình trạng hợp lệ; SỐ/MÃ thẻ BHYT là định danh — không thu.
- Mỗi biến mang ĐỦ thuộc tính và đi NGUYÊN VẸN tới SPSS/R (E5): `kieu` của ma trận ⇒ mức đo .sav / `measure` .rds (nhi_phan·danh_dinh→NOMINAL, thu_tu→ORDINAL, lien_tuc·dem·ngay→SCALE — biến thứ bậc PHẢI khai `thu_tu`, máy không đoán được từ nhãn); `vai_tro`·`muc_tieu`·`cau_hoi` ⇒ VARIABLE ATTRIBUTE + VARIABLE ROLE (.sav), attr role·objective·item (.rds); `Text Validation Min/Max` ⇒ khoảng hợp lệ (KhoangHopLe / valid_range). Khai min/max cho biến số, kiểm `integer` cho biến đếm.
- Định nghĩa trường quyết định khai báo SPSS/R: văn bản tự do = text KHÔNG kiểm; số = integer / number_Ndp (ghi rõ số lẻ); danh mục mã nhất quán (toàn số hoặc toàn chữ — lẫn lộn thì máy không tự quyết kiểu); mã thiếu chuỗi ≤ 8 byte.
- **Bảng bộ biến cho PI duyệt (G3-T2, bác sĩ chọn 15/11/2026):** đầu ra G3-T2 có thêm `G3_BO_BIEN_SO_<mã>.md` — NGUỒN NGƯỜI DUYỆT mà G5-AUTO-11 dùng để đối chiếu từ điển · mẫu nhập · SPSS/R (khi đề cương nộp chưa có bảng biến số). Soạn bằng `python3 tools/bang_bien_g3.py soan --study <mã> --ghi` SAU khi bộ biến + ma trận đạt; đọc mục 6 «Điểm PI cần xem tay» của bảng và nêu từng điểm cho PI.
- Bản MÁY soạn chỉ là nguồn người duyệt khi PI ghi `gate_params.G3.bo_bien_so_duyet = {"reviewed_at": "<ISO>", "dau_van_tay": "<dấu>"}`, dấu in bởi `python3 tools/bang_bien_g3.py trang-thai --study <mã>`. Agent CHÉP dấu cho PI nhìn — KHÔNG tự ghi xác nhận. Chưa duyệt ⇒ G5-AUTO-11 «không đo được», G5 không READY. Sửa bảng sau khi duyệt ⇒ xác nhận mất hiệu lực (sửa khung trạng thái thì không).
- Mọi bảng biến nằm DƯỚI dòng dấu máy (`<!-- BANG-BIEN-G3: …`). Không chèn bảng vào tiêu đề/khung trạng thái (máy coi là sửa tay ⇒ xác nhận mất hiệu lực, bộ đọc bỏ qua), không gỡ dòng dấu máy (vẫn là bản nháp chưa duyệt), lưu tệp UTF-8. Dấu nội dung giữ nguyên ranh giới dòng: chèn/xoá một dòng trống sau khi duyệt cũng làm xác nhận mất hiệu lực.
- Không ghi đè bảng người soạn, bảng đã duyệt, bảng đã bị sửa tay (kể cả ghi chú của PI trong khung trạng thái) — công cụ tự từ chối; `--ghi-de` chỉ dùng khi PI bảo soạn lại bản nháp. Bộ biến máy đổi sau khi PI duyệt ⇒ MT-12 cảnh báo và đối chiếu báo LỆCH theo bảng đã duyệt: sửa bộ máy theo bảng, hoặc soạn bảng mới để PI duyệt lại.

- **Giai đoạn mục tiêu (15/11/2026):** ma trận phải dùng ĐÚNG tên và kiểu trong bộ biến — trường REDCap `text` không khai `integer`/`number` (vd mã bàn khám) chỉ nhận `van_ban` (MT-07); biến nguồn dạng lặp «_k» (`uacr_k_ngay` = `uacr_1_ngay` … theo `lap_k`) được MT-08 nhận. MT-11: mục SAP ma trận trỏ tới phải có thật, và MỖI mục tiêu G1 phải có bảng/hình giả gắn nhãn «Mục tiêu k»/«MTk» (SAP §11 hoặc phần Dự kiến kết quả của đề cương nộp). Kiểm chung: trục `ma_tran_muc_tieu` của `nhat_quan_xuyen_cong` (C1a/BTM dựng 15/11 — `audit/nhat-ky/2026-11-15-muc-tieu-chua-noi-voi-bien-va-bang-gia.md`).
