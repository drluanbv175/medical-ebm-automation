- Kết cục SỐNG CÒN: ma trận khai kết cục chính là BIẾN THỜI GIAN kiểu `thoi_gian_den_su_kien`, chỉ báo biến cố vai `su_kien` kiểu `nhi_phan` — khai biến cố nhị phân làm kết cục chính bị G3-AUTO-19 chặn (lệch loại G1 đã chốt).
