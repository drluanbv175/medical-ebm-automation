<!DOCTYPE html>
<html lang="vi">
<!--
==================================================================================
  TEMPLATE CHUẨN — "DARK ANALYST"  (mẫu THAY THẾ, nền tối — dùng CHỈ KHI bác sĩ yêu
  cầu riêng; mẫu MẶC ĐỊNH cho Dashboard lâm sàng EBM là "Evidence Workbench" —
  web-dashboard-evidence-workbench.html, xem SKILL.md mục 5A)
  Dùng cho: skill cap-nhat-chung-cu-y-khoa/dark-analyst, KHI bác sĩ yêu cầu nền tối/dày dữ liệu.
----------------------------------------------------------------------------------
  CÁCH DÙNG (chỉ sửa 1 chỗ): thay khối hằng số DATA = {...} ở cuối <script> bằng
  nội dung đã XÁC MINH. KHÔNG cần đụng HTML/CSS/engine. Chrome (tiêu đề, PICO chips,
  KPI, verdict, Quick View) TỰ SINH từ DATA.

  SCHEMA (DÙNG CHUNG với evidence-workbench-template.html — 1 DATA chạy được cả hai,
  kể cả `standards` — Lớp 4 "Chuẩn & chất lượng" hiển thị ở CẢ HAI mẫu, đặt trong
  vùng cuộn của trang, thu gọn mặc định, bấm để mở; ẩn hoàn toàn nếu DATA.standards
  không khai báo):
    meta:    { eyebrow, question, pico:{P,I,C,O}, updated }
    summary: { conclusion, doNow:[…], dontDo:[…], redFlags:[…] }     // Clinical Quick View
            // ⚠ ĐÚNG 4 TÊN NÀY, không thêm không đổi. Gõ sai tên (vd `notDo`) thì nội
            // dung bị VỨT ÂM THẦM — panel rỗng trên MỌI sản phẩm, không báo lỗi.
            // Đã xảy ra thật 18/08/2026; nay verify_dashboard.py chặn cứng (BH61).
    standards?: {                                                    // Lớp 4: chuẩn cập nhật chứng cứ
      frame, sourceHierarchy, reporting, appraisal, currency, safety, vietnamFit,     // (ẩn cả khối nếu không khai báo — tương thích ngược)
      sourceVerification, lastVerified, verificationTool,
      searchSources:[…],
      gates:[{label, status:'ok'|'warn'|'need', note}]
    }
    items:   [ {
      id:'ITEM-01', title, source, org, dateVersion, pmid?, doi?, url?,
      design:'Guideline'|'Meta'|'RCT'|'Cohort'|'Consensus'|chuỗi mô tả,
                                          // chuỗi tự do được ánh xạ về HỌ theo TIỀN TỐ (vd
                                          // 'Cross-sectional — …' → Cắt ngang; 'Nhãn thuốc — …' →
                                          // Nhãn thuốc/cơ quan quản lý); không khớp họ nào → 'Khác'
      population,
      pico:{ P:[txt,'match'|'mis'], I:[…], C:[…], O:[…] },
      frame?:'PICO'|'PECO'|'Chẩn đoán'|'Tiên lượng'|…,            // khung câu hỏi (mặc định PICO)
      frameLabels?:{P,I,C,O},                                     // đổi nhãn 4 ô khi không-PICO
      effect?:{ measure,hr,lo,hi,ci,favors, scale?:'ratio'|'difference' },
                                          // chỉ điền nếu nguồn báo cáo; số trích ĐÚNG nguồn.
                                          // `hr` = ước lượng điểm của MỌI thước đo (giữ tên cũ).
                                          // TỶ SỐ (HR/RR/OR/IRR) vẽ thang log, vạch 1,0; CHÊNH
                                          // LỆCH (SMD/MD/RD/'Chênh…'/'Hiệu số trung bình…') vẽ
                                          // thang tuyến tính, vạch 0. Không khai `scale` thì suy
                                          // từ `measure`; nhãn lạ ⇒ 'ratio' (tương thích ngược).
      effectText?:'RD -1,84%/năm…',                              // hiệu số phi-tỷ-số dạng chữ (đúng nguồn)
      gradeSource, gradeLevel:'high'|'mod'|'low'|'vlow'|'na',
      decision:'apply'|'consider'|'notyet',
      groups:['cao-tuoi','thai-ky','tre-em','ckd','gan','dtd','tim-mach','da-thuoc'],
      action, monitoring, vn, references:[…], flag?, safety?,
      rob?:{ 'Ngẫu nhiên hóa':'l'|'s'|'h', … }                    // CHỈ cho RCT; bỏ trống cho guideline
    } ]
    etd?: { problem, desirable, undesirable, certainty, values, balance, resources, equity,   // GRADE Evidence-to-Decision (tùy chọn, cấp câu hỏi)
            acceptability, feasibility, recommendation, strength:'strong'|'conditional' }      // desirable/undesirable/certainty TỪ chứng cứ; còn lại = đánh giá vận hành

  LIÊM CHÍNH: số liệu trích ĐÚNG nguồn; giữ nguyên grading (gradeLevel:'na' nếu nguồn
  không phân hạng); RoB 2 chỉ chấm cho RCT; kèm PMID/DOI; disclaimer cố định; KHÔNG PII.
==================================================================================
-->
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard EBM · Dark Analyst</title>
<style>
  :root{
    --bg:#0b1120; --bg-2:#0f172a; --surface:#111a2e; --surface-2:#16213b; --surface-3:#1c2942;
    --ink:#e7edf6; --ink-2:#aebbd0; --muted:#7689a6; --faint:#56688a;
    --line:#1e2c46; --line-2:#2a3b5c;
    --cyan:#22d3ee; --blue:#60a5fa; --violet:#a78bfa; --teal:#2dd4bf; --pink:#f472b6; --green:#34d399; --amber:#fbbf24; --orange:#fb923c; --red:#f87171;
    /* họ thiết kế thêm 2026-09-16 (xem DESIGN_FAMILIES trong ENGINE) — 5 họ cũ TÁI DÙNG
       màu sẵn có (--teal/--violet/--blue/--cyan/--pink), chỉ 6 màu dưới đây là MỚI */
    --sr:#818cf8; --trial:#38bdf8; --casectl:#fb7185; --caseser:#e879f9; --xsec:#a3e635; --stone:#a8a29e;
    --g-high:#34d399; --g-mod:#fbbf24; --g-low:#fb923c; --g-vlow:#f87171; --g-na:#7689a6;
    --apply:#34d399; --consider:#fbbf24; --notyet:#fb923c; --danger:#f87171;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:12.5px;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
  a{color:var(--cyan);text-decoration:none}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--bg-2);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;white-space:nowrap}
  .brand .logo{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06121f;display:grid;place-items:center;font-size:14px;font-weight:800}
  .brand .tag{font-size:9.5px;font-weight:700;color:var(--cyan);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;letter-spacing:.4px}
  .cmd{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 11px}
  .cmd .pr{color:var(--cyan);font-family:var(--mono);font-weight:700}
  .cmd input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-family:var(--mono);font-size:12.5px}
  .cmd .kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
  .top .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
  .top .st .pulse{width:7px;height:7px;border-radius:50%;background:var(--g-high);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .qbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .qbar .lab{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-right:2px}
  .ptok{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-family:var(--mono)}
  .ptok b{font-size:9px;color:#06121f;border-radius:3px;padding:1px 5px;font-weight:800}
  .ptok.p b{background:var(--cyan)}.ptok.i b{background:var(--blue)}.ptok.c b{background:var(--muted)}.ptok.o b{background:var(--teal)}
  .fchip{font-size:10.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:3px 11px;cursor:pointer;user-select:none;white-space:nowrap}
  .fchip:hover{border-color:var(--cyan)}
  .fchip.on{background:rgba(34,211,238,.14);border-color:var(--cyan);color:var(--cyan);font-weight:700}
  .fchip .ct{font-family:var(--mono);font-size:9px;opacity:.8;margin-left:3px}

  .kpis{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-2);border-bottom:1px solid var(--line)}
  .kp{padding:9px 14px;border-right:1px solid var(--line)}
  .kp:last-child{border-right:0}
  .kp .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .kp .v{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:1px}
  .kp .v.cy{color:var(--cyan)}.kp .v.gr{color:var(--g-high)}.kp .v.am{color:var(--amber)}.kp .v.or{color:var(--orange)}.kp .v.vi{color:var(--violet)}

  /* GRADE Evidence-to-Decision */
  .etd{background:var(--bg-2);border-bottom:1px solid var(--line);padding:9px 16px}
  .etd .eh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--violet);margin-bottom:7px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  /* EtD thu gọn mặc định (bấm để mở) — tránh chiếm chiều cao đầu trang */
  .etd-d>summary{cursor:pointer;list-style:none;user-select:none;margin-bottom:0}
  .etd-d>summary::-webkit-details-marker{display:none}
  .etd-d>summary::before{content:"▸ ";color:var(--cyan);font-weight:800}
  .etd-d[open]>summary::before{content:"▾ "}
  .etd-d[open]>summary{margin-bottom:7px}
  .etd-d>summary .note{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0;font-size:10px}
  .etd .eh .note{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0;font-size:10px}
  .etd-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .etd-c{background:var(--bg-2);padding:7px 10px}
  .etd-c .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;display:flex;gap:5px;align-items:center}
  .etd-c .l .src{font-size:8px;color:var(--teal);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;text-transform:none}
  .etd-c .l .op{font-size:8px;color:var(--amber);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;text-transform:none}
  .etd-c .v{font-size:11px;color:var(--ink-2);line-height:1.4;margin-top:3px}
  .etd-rec{margin-top:9px;background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(167,139,250,.1));border:1px solid var(--line-2);border-radius:10px;padding:9px 12px}
  .etd-rec .rh{font-size:10px;font-weight:800;color:var(--g-high);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .etd-rec .rh .str{font-size:9px;color:#06121f;background:var(--g-high);border-radius:4px;padding:1px 7px}
  .etd-rec .rv{font-size:12px;color:var(--ink);line-height:1.5}

  /* Lớp 4 — STANDARDS / QUALITY: chuẩn cập nhật chứng cứ, thẩm định và truy nguyên
     (thêm 2026-09-16, cùng khuôn evidence-workbench-template.html). Dùng chung khối
     chrome collapsible với .etd/.etd-d (section nền + tam giác thu gọn); chỉ định
     nghĩa thêm phần nội dung riêng (lưới hộp, cổng liêm chính, bảng truy nguyên).
     Đặt BÊN TRONG .main (cuộn được) thay vì phần chrome cố định trên đầu trang —
     gates + bảng truy nguyên có thể dài hơn 1 màn hình; đặt ở phần chrome (như .etd)
     sẽ bị .app{overflow:hidden} cắt mất khi mở, vì .app không tự cuộn (chỉ .main). */
  .qual-wrap{border-top:1px solid var(--line);margin-top:2px}
  .qual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .qbox{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
  .qbox.wide{grid-column:1/-1}
  .qbox h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:6px}
  .qbox .v{font-size:11px;color:var(--ink-2);line-height:1.5}
  .qbox .hint{font-size:10px;color:var(--faint);line-height:1.4;margin-top:5px}
  .qgate{display:flex;flex-direction:column;gap:6px}
  .gate{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px}
  .gate .s{display:inline-flex;justify-content:center;border-radius:999px;font-size:9px;font-weight:800;padding:2px 6px;text-transform:uppercase;letter-spacing:.3px}
  .gate.ok .s{background:rgba(52,211,153,.16);color:var(--g-high)}
  .gate.warn .s{background:rgba(251,191,36,.16);color:var(--g-mod)}
  .gate.need .s{background:rgba(248,113,113,.16);color:var(--g-vlow)}
  .gate .t{font-size:11px;color:var(--ink);font-weight:700;line-height:1.35}
  .gate .g{font-size:10px;color:var(--muted);line-height:1.4;margin-top:1px}
  .qtrace{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .qtrace .row{display:grid;grid-template-columns:74px minmax(0,1fr) 118px;gap:9px;align-items:start;border-bottom:1px solid var(--line);padding:7px 0}
  .qtrace .id{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .qtrace .name{font-size:11px;color:var(--ink);font-weight:600;line-height:1.35}
  .qtrace .srcx{font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px}
  .qtrace .ok2{font-size:9.5px;font-weight:800;color:var(--g-high);white-space:nowrap}
  .qtrace .need2{font-size:9.5px;font-weight:800;color:var(--g-vlow);white-space:nowrap}

  /* Clinical Quick View band */
  .qv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .qvc{background:var(--bg-2);padding:9px 14px}
  .qvc .h{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .qvc.concl .h{color:var(--cyan)} .qvc.do .h{color:var(--apply)} .qvc.dont .h{color:var(--notyet)} .qvc.flag .h{color:var(--danger)}
  .qvc p{font-size:11px;color:var(--ink-2);line-height:1.45}
  .qvc ul{list-style:none;display:flex;flex-direction:column;gap:3px}
  .qvc li{font-size:10.5px;color:var(--ink-2);display:flex;gap:6px;line-height:1.4}
  .qvc li::before{content:"▪";color:var(--faint);flex-shrink:0}
  .qvc.flag li::before{content:"⚑";color:var(--danger)}

  .main{flex:1;overflow:auto;padding:0 0 40px}
  .lead{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:11px;color:var(--muted)}
  .lead .verdict{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--g-high);border-radius:20px;padding:4px 12px;font-weight:700;font-size:11px}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  thead th{position:sticky;top:0;background:var(--bg-2);text-align:left;padding:8px 14px;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line-2);border-top:1px solid var(--line);z-index:3;white-space:nowrap}
  tbody tr.main-row{border-bottom:1px solid var(--line);cursor:pointer}
  tbody tr.main-row:hover{background:var(--surface)}
  tbody tr.main-row.open{background:var(--surface-2)}
  tbody td{padding:9px 14px;vertical-align:middle}
  .twist{color:var(--faint);transition:transform .15s;display:inline-block;width:12px}
  tr.open .twist{transform:rotate(90deg);color:var(--cyan)}
  .ttl{font-weight:600;color:var(--ink);line-height:1.3;max-width:430px}
  .ttl .sub{font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px}
  .pmid{font-family:var(--mono);color:var(--cyan);font-size:10px}
  .idtag{font-family:var(--mono);color:var(--faint);font-size:9px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .b-rct{background:rgba(96,165,250,.12);color:var(--blue);border-color:rgba(96,165,250,.25)}.b-rct .d{background:var(--blue)}
  .b-meta{background:rgba(167,139,250,.12);color:var(--violet);border-color:rgba(167,139,250,.25)}.b-meta .d{background:var(--violet)}
  .b-guide{background:rgba(45,212,191,.12);color:var(--teal);border-color:rgba(45,212,191,.25)}.b-guide .d{background:var(--teal)}
  .b-cohort{background:rgba(34,211,238,.12);color:var(--cyan);border-color:rgba(34,211,238,.25)}.b-cohort .d{background:var(--cyan)}
  .b-consensus{background:rgba(244,114,182,.12);color:var(--pink);border-color:rgba(244,114,182,.25)}.b-consensus .d{background:var(--pink)}
  .b-sr{background:rgba(129,140,248,.12);color:var(--sr);border-color:rgba(129,140,248,.25)}.b-sr .d{background:var(--sr)}
  .b-trial{background:rgba(56,189,248,.12);color:var(--trial);border-color:rgba(56,189,248,.25)}.b-trial .d{background:var(--trial)}
  .b-casectl{background:rgba(251,113,133,.12);color:var(--casectl);border-color:rgba(251,113,133,.25)}.b-casectl .d{background:var(--casectl)}
  .b-caseser{background:rgba(232,121,249,.12);color:var(--caseser);border-color:rgba(232,121,249,.25)}.b-caseser .d{background:var(--caseser)}
  .b-xsec{background:rgba(163,230,53,.12);color:var(--xsec);border-color:rgba(163,230,53,.25)}.b-xsec .d{background:var(--xsec)}
  .b-druglabel{background:rgba(251,146,60,.12);color:var(--orange);border-color:rgba(251,146,60,.25)}.b-druglabel .d{background:var(--orange)}
  .b-mech{background:rgba(168,162,158,.12);color:var(--stone);border-color:rgba(168,162,158,.25)}.b-mech .d{background:var(--stone)}
  .b-other{background:rgba(118,137,166,.12);color:var(--muted);border-color:rgba(118,137,166,.25)}.b-other .d{background:var(--muted)}

  .dec{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .dec .d{width:6px;height:6px;border-radius:50%}
  .d-apply{background:rgba(52,211,153,.14);color:var(--apply)}.d-apply .d{background:var(--apply)}
  .d-consider{background:rgba(251,191,36,.14);color:var(--consider)}.d-consider .d{background:var(--consider)}
  .d-notyet{background:rgba(251,146,60,.14);color:var(--notyet)}.d-notyet .d{background:var(--notyet)}

  .grade{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:20px}
  .grade .pips{display:flex;gap:2px}.grade .pip{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25}.grade .pip.on{opacity:1}

/* THANG HIỆU SỐ — thêm 2026-09-16, cùng khuôn evidence-workbench-template.html. Forest

     TIÊN bắt đầu bằng Δ hoặc β (ΔHbA1c, hệ số β) ⇒ chênh lệch;
   • không nhận ra gì ⇒ 'ratio' — tương thích ngược với mọi dashboard cũ.
   Tỷ số có giá trị ≤ 0 không tồn tại trên thang log ⇒ KHÔNG vẽ (trước đây bị ép vào mép trái).
   Danh sách PHẢI TRÙNG KHÍT tools/build_ban_doc_chung_cu.py (bản đọc) và
   evidence-workbench-template.html — test canh: tools/test_ew_template_ho_thiet_ke_thang_hieu_so.py.
   Chiều CÓ LỢI không suy từ phía của vạch: màu vẫn theo effect.favors như cũ. */
const SCALE_RATIO_TERMS=['hr','rr','or','irr','ahr','aor','shr','cshr','ror','rom','tỷ số','ty so','tỷ suất chênh','ty suat chenh','nguy cơ tương đối','hazard ratio','odds ratio','risk ratio','rate ratio','relative risk'];
const SCALE_DIFF_TERMS=['smd','md','wmd','rd','chênh','chenh','hiệu số trung bình','hiệu số trung bình chuẩn hoá','hiệu số trung bình chuẩn hóa','hiệu số rủi ro','hiệu số nguy cơ','khác biệt trung bình','mean difference','standardized mean difference','standardised mean difference','risk difference','hedges','cohen'];
const SCALE_DIFF_FIRST_TOKEN_PREFIXES=['δ','β'];
function scaleTokens(s){return String(s??'').replace(/∆/g,'Δ').normalize('NFC').toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];}
const SCALE_TERM_TOKENS=SCALE_RATIO_TERMS.map(x=>[scaleTokens(x),'ratio']).concat(SCALE_DIFF_TERMS.map(x=>[scaleTokens(x),'difference']));
function measureScale(measure){
  const t=scaleTokens(measure);
  if(t.length&&SCALE_DIFF_FIRST_TOKEN_PREFIXES.some(p=>t[0].startsWith(p))) return 'difference';
  for(let i=0;i<t.length;i++){
    let kind=null,len=0;
    for(const [p,k] of SCALE_TERM_TOKENS) if(p.length>len&&i+p.length<=t.length&&p.every((w,j)=>t[i+j]===w)){kind=k;len=p.length;}
    if(kind) return kind;
  }
  return 'ratio';
}
function effectScale(e){
  const s=String((e&&e.scale)??'').trim().toLowerCase();
  return (s==='ratio'||s==='difference')?s:measureScale(e&&e.measure);
}

const FMIN=0.4,FMAX=2.0;
function lx(v){const a=Math.log(FMIN),b=Math.log(FMAX);return (Math.log(Math.min(Math.max(v,FMIN),FMAX))-a)/(b-a);}
function forest(e,w,h){
  const num=v=>typeof v==='number'&&isFinite(v);
  if(!e||!num(e.hr)) return '<span style="color:var(--faint);font-size:10px">—</span>';
  const sc=effectScale(e),ci=num(e.lo)&&num(e.hi);
  let px,x1;
  if(sc==='difference'){
    /* thang TUYẾN TÍNH đối xứng quanh 0, tự co giãn theo |hr|, |lo|, |hi| (chừa lề 15%) */
    const ext=Math.max(Math.abs(e.hr),ci?Math.abs(e.lo):0,ci?Math.abs(e.hi):0)*1.15||1;
    px=v=>w*(0.5+v/(2*ext)); x1=w/2;
  }else{
    if(e.hr<=0||(ci&&(e.lo<=0||e.hi<=0))) return `<span style="color:var(--faint);font-size:10px" title="Có giá trị ≤ 0 — không vẽ được trên thang tỷ số (log). Nếu đây là hiệu số chênh lệch, khai effect.scale:'difference'.">—</span>`;
    px=v=>w*lx(v); x1=w*lx(1);
  }
  const cx=px(e.hr),col=e.favors?'var(--g-high)':(e.favors===false?'var(--g-vlow)':'var(--muted)');
  return `<svg width="${w}" height="${h}" data-scale="${sc}"><line x1="${x1}" y1="2" x2="${x1}" y2="${h-2}" stroke="var(--line-2)" stroke-dasharray="2 2"/>${ci?`<line x1="${px(e.lo)}" y1="${h/2}" x2="${px(e.hi)}" y2="${h/2}" stroke="${col}" stroke-width="2"/>`:''}<rect x="${cx-3}" y="${h/2-3}" width="6" height="6" fill="${col}" transform="rotate(45 ${cx} ${h/2})"/></svg>`;
}
function effCell(e){
  if(e.effect&&e.effect.hr!=null){const f=e.effect;return `<span class="effect ${f.favors?'fav':(f.favors===false?'harm':'ns')}">${f.hr.toFixed(2)}</span> <span class="ci">(${escHtml(f.ci||'')})</span>`;}
  if(e.effectText) return `<span class="effect ns" style="font-size:10.5px">${escHtml(e.effectText)}</span>`;
  return '<span class="effect ns">—</span>';
}

function renderStatic(){
  document.title='Dashboard EBM · '+DATA.meta.question+' · Dark Analyst';
  document.getElementById('status').textContent=DATA.items.length+' nguồn đã xác minh';
  document.getElementById('upd').textContent='Cập nhật: '+(DATA.meta.updated||'');
  const p=DATA.meta.pico||{};
  document.getElementById('qbar').innerHTML=
    `<span class="lab">PICO</span>`+
    `<span class="ptok p"><b>P</b> ${escHtml(p.P||'')}</span><span class="ptok i"><b>I</b> ${escHtml(p.I||'')}</span>`+
    `<span class="ptok c"><b>C</b> ${escHtml(p.C||'')}</span><span class="ptok o"><b>O</b> ${escHtml(p.O||'')}</span>`;
  // KPI tự tính
  const it=DATA.items, c=k=>it.filter(x=>x.decision===k).length;
  const cd=d=>it.filter(x=>designFamily(x.design)===d).length;
  const newest=it.map(x=>x.dateVersion).filter(Boolean).sort().slice(-1)[0]||'—';
  const kp=[
    ['Nguồn',it.length,'cy'],['Áp dụng ngay',c('apply'),'gr'],['Cân nhắc',c('consider'),'am'],['Chưa đủ',c('notyet'),'or'],
    ['GRADE Cao',it.filter(x=>x.gradeLevel==='high').length,'gr'],['RCT+Meta',cd('RCT')+cd('Meta'),'vi'],['Mới nhất',newest,'']
  ];
  document.getElementById('kpis').innerHTML=kp.map(d=>`<div class="kp"><div class="l">${d[0]}</div><div class="v ${d[2]}">${escHtml(d[1])}</div></div>`).join('');
  // Quick View — LỌC PHÒNG VỆ giống bản Evidence Workbench: bỏ gạch đầu dòng nhồi abstract ngoại ngữ;
  // "Nên làm" rỗng sau lọc → suy từ hành động item "Áp dụng ngay" (tiếng Việt thật; KHÔNG bịa).
  const s=DATA.summary||{}, li=a=>(a||[]).map(x=>`<li>${escHtml(x)}</li>`).join('')||'<li style="color:var(--faint)">—</li>';
  const _hasVi=t=>/[ăâđêôơưàáạảãằắặẳẵầấậẩẫèéẹẻẽềếệểễìíịỉĩòóọỏõồốộổỗờớợởỡùúụủũừứựửữỳýỵỷỹ]/i.test(t);
  const _foreign=t=>{t=String(t||'').trim();if(/^(conclusion|in conclusion|keywords?|background|objective|methods?|results?|findings?|introduction|aim|purpose)\b/i.test(t))return true;return t.split(/\s+/).length>=5&&!_hasVi(t);};
  const _clean=a=>(a||[]).filter(x=>x&&!_foreign(x));
  const _firstSentence=t=>{const m=String(t||'').split(/(?<=[.;])\s+/)[0];return (m||String(t||'')).trim();};
  const _placeholder=t=>/^\s*\[\s*CẦN/i.test(String(t||''));
  const _usable=t=>t&&_hasVi(t)&&!_placeholder(t);
  let doNow=_clean(s.doNow);
  if(doNow.length===0){
    doNow=(DATA.items||[]).filter(e=>e.decision==='apply').map(e=>{
      const a=_firstSentence(e.action||''); if(_usable(a)) return a;
      const v=_firstSentence(e.vn||'');     return _usable(v)?v:'';
    }).filter(Boolean).slice(0,4);
  }
  document.getElementById('qv').innerHTML=`
    <div class="qvc concl"><div class="h">✓ Kết luận thực hành</div><p>${escHtml(s.conclusion||'—')}</p></div>
    <div class="qvc do"><div class="h">➤ Nên làm</div><ul>${li(doNow)}</ul></div>
    <div class="qvc dont"><div class="h">⊘ Không nên / giới hạn</div><ul>${li(_clean(s.dontDo))}</ul></div>
    <div class="qvc flag"><div class="h">⚑ Cờ đỏ / chuyển tuyến</div><ul>${li(_clean(s.redFlags))}</ul></div>`;
  // GRADE Evidence-to-Decision (tùy chọn)
  const etd=DATA.etd, etdEl=document.getElementById('etd');
  if(etd){
    const cell=(label,val,tag)=>`<div class="etd-c"><div class="l">${label}${tag==='src'?'<span class="src">nguồn</span>':tag==='op'?'<span class="op">vận hành</span>':''}</div><div class="v">${escHtml(val||'—')}</div></div>`;
    etdEl.innerHTML=`<details class="etd-d"><summary class="eh">⚖ GRADE Evidence-to-Decision <span class="note">— bấm để mở/đóng · "nguồn" = từ chứng cứ đã xác minh · "vận hành" = đánh giá của người tổng hợp</span></summary>
      <div class="etd-grid">
        ${cell('Vấn đề ưu tiên',etd.problem,'op')}
        ${cell('Lợi ích mong muốn',etd.desirable,'src')}
        ${cell('Tác hại',etd.undesirable,'src')}
        ${cell('Độ chắc chắn',etd.certainty,'src')}
        ${cell('Giá trị/ưu tiên BN',etd.values,'op')}
        ${cell('Cân bằng lợi–hại',etd.balance,'op')}
        ${cell('Nguồn lực/chi phí',etd.resources,'op')}
        ${cell('Công bằng',etd.equity,'op')}
        ${cell('Chấp nhận',etd.acceptability,'op')}
        ${cell('Khả thi',etd.feasibility,'op')}
      </div>
      ${etd.recommendation?`<div class="etd-rec"><div class="rh">➤ Khuyến cáo (đánh giá vận hành)${etd.strength?`<span class="str">${escHtml(etd.strength==='strong'?'Mạnh':'Có điều kiện')}</span>`:''}</div><div class="rv">${escHtml(etd.recommendation)}</div></div>`:''}</details>`;
    etdEl.style.display='';
  }
  // Lớp 4 — Chuẩn & chất lượng: chỉ hiện khi DATA.standards có khai báo (tương thích ngược
  // với dashboard cũ chưa có field này — không bịa khung rỗng, không crash).
  const st=DATA.standards, qualEl=document.getElementById('qual');
  if(st){
    qualEl.innerHTML=qualityView(st);
    qualEl.style.display='';
  }
  document.getElementById('verdict').textContent='✓ '+c('apply')+' áp dụng ngay · '+c('consider')+' cân nhắc · '+c('notyet')+' chưa đủ';
  buildFilters();
}
function buildFilters(){
  const it=DATA.items;
  const nSafe=it.filter(x=>x.safety).length;
  const chips=[['all','Tất cả',it.length],['apply','Áp dụng ngay',it.filter(x=>x.decision==='apply').length],
    ['consider','Cân nhắc',it.filter(x=>x.decision==='consider').length],['notyet','Chưa đủ',it.filter(x=>x.decision==='notyet').length],
    ['safety','⚑ An toàn',nSafe]];
  document.getElementById('filters').innerHTML='<span class="lab">LỌC</span>'+chips.map(c=>`<span class="fchip ${state.filter===c[0]?'on':''}" onclick="setFilter('${c[0]}')">${c[1]}<span class="ct">${c[2]}</span></span>`).join('');
}
function setFilter(f){state.filter=f;render();buildFilters();}

function filtered(){
  let arr=DATA.items.slice();
  if(state.filter==='safety') arr=arr.filter(x=>x.safety);
  else if(state.filter!=='all') arr=arr.filter(x=>x.decision===state.filter);
  if(state.q){const q=state.q.toLowerCase();arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q));}
  return arr;
}
function render(){
  state.q=document.getElementById('q').value.trim().toLowerCase();
  const arr=filtered(),rows=[];
  document.getElementById('leadcount').textContent=arr.length+' điểm chứng cứ';
  arr.forEach(e=>{
    const dm=DESIGN_META[designFamily(e.design)],gm=GRADE_META[e.gradeLevel]||GRADE_META.na,dec=DEC_META[e.decision]||DEC_META.consider;
    const pips=Array.from({length:4},(_,i)=>`<span class="pip ${i<gm[2]?'on':''}"></span>`).join('');
    const robEs=robEntries(e.rob);
    const robm=robEs?robEs.map(([,r])=>`<i class="${RM[r][0]}" title="${RM[r][1]}"></i>`).join('')
      :(typeof e.rob==='string'&&e.rob.trim())?`<span class="robnote"><span class="dot"></span><span class="tx" title="${escHtml(e.rob)}">${escHtml(e.rob)}</span></span>`
      :'<span style="color:var(--faint);font-size:10px">—</span>';
    rows.push(`<tr class="main-row ${state.open===e.id?'open':''}" onclick="toggle('${escJs(e.id)}')">
      <td><span class="twist">▸</span></td>
      <td><div class="ttl">${escHtml(e.title)}${e.flag?`<span class="flag">⚑ ${escHtml(e.flag)}</span>`:''}<div class="sub">${escHtml(e.source)} · <span class="idtag">${escHtml(e.id)}</span>${e.pmid?` · PMID <span class="pmid">${escHtml(e.pmid)}</span>`:''}</div></div></td>
      <td><span class="dec ${dec[0]}"><span class="d"></span>${dec[1]}</span></td>
      <td><span class="badge ${dm[0]}" title="${escHtml(e.design||'')}"><span class="d"></span>${dm[1]}</span></td>
      <td>${effCell(e)}</td>
      <td><span class="grade ${gm[0]}"><span class="pips">${pips}</span>${gm[1]}</span></td>
      <td><div class="robmini">${robm}</div></td>
    </tr>`);
    if(state.open===e.id) rows.push(expandRow(e));
  });
  document.getElementById('rows').innerHTML=rows.join('')||`<tr><td colspan="7" class="empty">Không có điểm chứng cứ khớp bộ lọc.</td></tr>`;
}
function expandRow(e){
  const FL=e.frameLabels||{P:'P',I:'I',C:'C',O:'O'};
  const picoRows=['P','I','C','O'].map(k=>{const d=(e.pico||{})[k]||['—','match'];return `<div class="pico-r"><span class="k k${k}">${escHtml(FL[k]||k)}</span><span class="v">${escHtml(d[0])} ${d[1]==='match'?'<span class="ok">✓</span>':'<span class="no">⚠</span>'}</span></div>`;}).join('');
  const f=e.effect, fSc=f?effectScale(f):'ratio';
  const robEsFull=robEntries(e.rob);
  const robFull=robEsFull?robEsFull.map(([d,r])=>`<div class="r"><span>${escHtml(d)}</span><i class="${RM[r][0]}">${RM[r][1]}</i></div>`).join('')
    :(typeof e.rob==='string'&&e.rob.trim())?`<div class="robtext">${escHtml(e.rob)}</div>`
    :'<div class="r" style="color:var(--faint)">RoB 2 chỉ áp dụng cho RCT — không chấm cho guideline/tổng quan.</div>';
  const forestBox=(f&&f.hr!=null)?`<h5 style="margin-top:14px">⊞ Forest (${fSc==='difference'?'vạch 0 = không khác biệt':'vs ngưỡng 1.0'})</h5><div style="background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center">${forest(f,200,26)}<div style="font-size:9px;color:var(--faint);margin-top:4px;font-family:var(--mono)">${fSc==='difference'?'◄ ủng hộ điều trị · thang tuyến tính, vạch 0 · bất lợi ►':`◄ ủng hộ điều trị · ${FMIN} — 1.0 — ${FMAX} · bất lợi ►`}</div></div>`:'';
  return `<tr class="exp"><td colspan="7"><div class="exp-in">
    <div class="exp-col">
      <h5>◧ Đối chiếu ${escHtml(e.frame||'PICO')}</h5>
      ${picoRows}
      ${forestBox}
    </div>
    <div class="exp-col">
      <h5>∑ Số liệu & thẩm định</h5>
      <div class="kv">
        <div class="c"><div class="l">Hiệu số (nguồn)</div><div class="n ${(f&&f.favors)?'gr':''}">${(f&&f.hr!=null)?f.hr.toFixed(2)+' ('+escHtml(f.ci||'')+')':escHtml(e.effectText||'—')}</div></div>
        <div class="c"><div class="l">Quần thể</div><div class="n" style="font-size:11px">${escHtml(e.population||'—')}</div></div>
      </div>
      <div class="kvline">
        <div class="r"><span class="k">Thiết kế</span><span class="v">${escHtml(e.design||'—')}</span></div>
        <div class="r"><span class="k">Grading nguồn</span><span class="v">${escHtml(e.gradeSource||'Nguồn không cung cấp phân hạng')}</span></div>
      </div>
      <h5>◉ Nguy cơ sai lệch (RoB 2)</h5>
      <div class="robfull">${robFull}</div>
    </div>
    <div class="exp-col">
      <h5>➤ Áp dụng lâm sàng</h5>
      <div class="apply"><div class="h">💡 Hành động</div>${escHtml(e.action||'—')}</div>
      <div class="kvline" style="margin-top:10px">
        <div class="r"><span class="k">Monitoring</span><span class="v">${escHtml(e.monitoring||'—')}</span></div>
        <div class="r"><span class="k">Nhóm</span><span class="v">${escHtml((e.groups||[]).map(g=>GROUP_META[g]||g).join(', ')||'—')}</span></div>
        <div class="r"><span class="k">Việt Nam</span><span class="v">${escHtml(e.vn||'—')}</span></div>
      </div>
      ${e.safety?`<div class="safety"><div class="h">⚑ An toàn / chuyển tuyến</div>${escHtml(e.safety)}</div>`:''}
      <div class="srcs">
        ${e.pmid?`<a href="https://pubmed.ncbi.nlm.nih.gov/${encodeURIComponent(e.pmid)}/" target="_blank" rel="noopener"><span class="t pm">PMID</span> ${escHtml(e.pmid)}</a>`:''}
        ${e.doi?`<a href="https://doi.org/${encodeURIComponent(e.doi)}" target="_blank" rel="noopener"><span class="t doi">DOI</span> mở</a>`:''}
        ${escUrl(e.url)?`<a href="${escUrl(e.url)}" target="_blank" rel="noopener"><span class="t url">URL</span> nguồn</a>`:''}
      </div>
      ${(e.references&&e.references.length)?`<div class="reflist">${e.references.map(r=>`<div class="r">${escHtml(r)}</div>`).join('')}</div>`:''}
    </div>
  </div></td></tr>`;
}
function toggle(id){state.open=state.open===id?null:id;render();}

renderStatic();render();
</script>
</body>
</html>
