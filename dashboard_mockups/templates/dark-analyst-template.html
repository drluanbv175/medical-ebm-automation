<!DOCTYPE html>
<html lang="vi">
<!--
==================================================================================
  TEMPLATE CHUẨN — "DARK ANALYST"  (Mẫu MẶC ĐỊNH mới cho Dashboard lâm sàng EBM)
  Dùng cho: skill cap-nhat-chung-cu-y-khoa và mọi tác vụ tạo Web Dashboard lâm sàng.
----------------------------------------------------------------------------------
  CÁCH DÙNG (chỉ sửa 1 chỗ): thay khối hằng số DATA = {...} ở cuối <script> bằng
  nội dung đã XÁC MINH. KHÔNG cần đụng HTML/CSS/engine. Chrome (tiêu đề, PICO chips,
  KPI, verdict, Quick View) TỰ SINH từ DATA.

  SCHEMA (DÙNG CHUNG với evidence-workbench-template.html — 1 DATA chạy được cả hai):
    meta:    { eyebrow, question, pico:{P,I,C,O}, updated }
    summary: { conclusion, doNow:[…], dontDo:[…], redFlags:[…] }     // Clinical Quick View
    items:   [ {
      id:'ITEM-01', title, source, org, dateVersion, pmid?, doi?, url?,
      design:'Guideline'|'Meta'|'RCT'|'Cohort'|'Consensus',
      population,
      pico:{ P:[txt,'match'|'mis'], I:[…], C:[…], O:[…] },
      frame?:'PICO'|'PECO'|'Chẩn đoán'|'Tiên lượng'|…,            // khung câu hỏi (mặc định PICO)
      frameLabels?:{P,I,C,O},                                     // đổi nhãn 4 ô khi không-PICO
      effect?:{ measure,hr,lo,hi,ci,favors },                     // CHỈ khi có tỷ số (HR/RR/OR) → forest
      effectText?:'RD -1,84%/năm…',                              // hiệu số phi-tỷ-số dạng chữ (đúng nguồn)
      gradeSource, gradeLevel:'high'|'mod'|'low'|'vlow'|'na',
      decision:'apply'|'consider'|'notyet',
      groups:['cao-tuoi','ckd','gan','dtd','tim-mach','da-thuoc'],
      action, monitoring, vn, references:[…], flag?, safety?,
      rob?:{ 'Ngẫu nhiên hóa':'l'|'s'|'h', … }                    // CHỈ cho RCT; bỏ trống cho guideline
    } ]
    etd?: { problem, desirable, undesirable, certainty, values, balance, resources, equity,   // GRADE Evidence-to-Decision (tùy chọn, cấp câu hỏi)
            acceptability, feasibility, recommendation, strength:'strong'|'conditional' }      // desirable/undesirable/certainty TỪ chứng cứ; còn lại = đánh giá vận hành

  LIÊM CHÍNH: số liệu trích ĐÚNG nguồn; giữ nguyên grading (gradeLevel:'na' nếu nguồn
  không phân hạng); RoB 2 chỉ chấm cho RCT; kèm PMID/DOI; disclaimer cố định; KHÔNG PII.
==================================================================================
-->
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard EBM · Dark Analyst</title>
<style>
  :root{
    --bg:#0b1120; --bg-2:#0f172a; --surface:#111a2e; --surface-2:#16213b; --surface-3:#1c2942;
    --ink:#e7edf6; --ink-2:#aebbd0; --muted:#7689a6; --faint:#56688a;
    --line:#1e2c46; --line-2:#2a3b5c;
    --cyan:#22d3ee; --blue:#60a5fa; --violet:#a78bfa; --teal:#2dd4bf; --pink:#f472b6; --green:#34d399; --amber:#fbbf24; --orange:#fb923c; --red:#f87171;
    --g-high:#34d399; --g-mod:#fbbf24; --g-low:#fb923c; --g-vlow:#f87171; --g-na:#7689a6;
    --apply:#34d399; --consider:#fbbf24; --notyet:#fb923c; --danger:#f87171;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:12.5px;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
  a{color:var(--cyan);text-decoration:none}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--bg-2);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;white-space:nowrap}
  .brand .logo{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06121f;display:grid;place-items:center;font-size:14px;font-weight:800}
  .brand .tag{font-size:9.5px;font-weight:700;color:var(--cyan);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;letter-spacing:.4px}
  .cmd{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 11px}
  .cmd .pr{color:var(--cyan);font-family:var(--mono);font-weight:700}
  .cmd input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-family:var(--mono);font-size:12.5px}
  .cmd .kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
  .top .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
  .top .st .pulse{width:7px;height:7px;border-radius:50%;background:var(--g-high);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .qbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .qbar .lab{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-right:2px}
  .ptok{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-family:var(--mono)}
  .ptok b{font-size:9px;color:#06121f;border-radius:3px;padding:1px 5px;font-weight:800}
  .ptok.p b{background:var(--cyan)}.ptok.i b{background:var(--blue)}.ptok.c b{background:var(--muted)}.ptok.o b{background:var(--teal)}
  .fchip{font-size:10.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:3px 11px;cursor:pointer;user-select:none;white-space:nowrap}
  .fchip:hover{border-color:var(--cyan)}
  .fchip.on{background:rgba(34,211,238,.14);border-color:var(--cyan);color:var(--cyan);font-weight:700}
  .fchip .ct{font-family:var(--mono);font-size:9px;opacity:.8;margin-left:3px}

  .kpis{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-2);border-bottom:1px solid var(--line)}
  .kp{padding:9px 14px;border-right:1px solid var(--line)}
  .kp:last-child{border-right:0}
  .kp .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .kp .v{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:1px}
  .kp .v.cy{color:var(--cyan)}.kp .v.gr{color:var(--g-high)}.kp .v.am{color:var(--amber)}.kp .v.or{color:var(--orange)}.kp .v.vi{color:var(--violet)}

  /* GRADE Evidence-to-Decision */
  .etd{background:var(--bg-2);border-bottom:1px solid var(--line);padding:9px 16px}
  .etd .eh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--violet);margin-bottom:7px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  /* EtD thu gọn mặc định (bấm để mở) — tránh chiếm chiều cao đầu trang */
  .etd-d>summary{cursor:pointer;list-style:none;user-select:none;margin-bottom:0}
  .etd-d>summary::-webkit-details-marker{display:none}
  .etd-d>summary::before{content:"▸ ";color:var(--cyan);font-weight:800}
  .etd-d[open]>summary::before{content:"▾ "}
  .etd-d[open]>summary{margin-bottom:7px}
  .etd-d>summary .note{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0;font-size:10px}
  .etd .eh .note{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0;font-size:10px}
  .etd-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .etd-c{background:var(--bg-2);padding:7px 10px}
  .etd-c .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;display:flex;gap:5px;align-items:center}
  .etd-c .l .src{font-size:8px;color:var(--teal);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;text-transform:none}
  .etd-c .l .op{font-size:8px;color:var(--amber);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;text-transform:none}
  .etd-c .v{font-size:11px;color:var(--ink-2);line-height:1.4;margin-top:3px}
  .etd-rec{margin-top:9px;background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(167,139,250,.1));border:1px solid var(--line-2);border-radius:10px;padding:9px 12px}
  .etd-rec .rh{font-size:10px;font-weight:800;color:var(--g-high);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .etd-rec .rh .str{font-size:9px;color:#06121f;background:var(--g-high);border-radius:4px;padding:1px 7px}
  .etd-rec .rv{font-size:12px;color:var(--ink);line-height:1.5}

  /* Clinical Quick View band */
  .qv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .qvc{background:var(--bg-2);padding:9px 14px}
  .qvc .h{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .qvc.concl .h{color:var(--cyan)} .qvc.do .h{color:var(--apply)} .qvc.dont .h{color:var(--notyet)} .qvc.flag .h{color:var(--danger)}
  .qvc p{font-size:11px;color:var(--ink-2);line-height:1.45}
  .qvc ul{list-style:none;display:flex;flex-direction:column;gap:3px}
  .qvc li{font-size:10.5px;color:var(--ink-2);display:flex;gap:6px;line-height:1.4}
  .qvc li::before{content:"▪";color:var(--faint);flex-shrink:0}
  .qvc.flag li::before{content:"⚑";color:var(--danger)}

  .main{flex:1;overflow:auto;padding:0 0 40px}
  .lead{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:11px;color:var(--muted)}
  .lead .verdict{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--g-high);border-radius:20px;padding:4px 12px;font-weight:700;font-size:11px}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  thead th{position:sticky;top:0;background:var(--bg-2);text-align:left;padding:8px 14px;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line-2);border-top:1px solid var(--line);z-index:3;white-space:nowrap}
  tbody tr.main-row{border-bottom:1px solid var(--line);cursor:pointer}
  tbody tr.main-row:hover{background:var(--surface)}
  tbody tr.main-row.open{background:var(--surface-2)}
  tbody td{padding:9px 14px;vertical-align:middle}
  .twist{color:var(--faint);transition:transform .15s;display:inline-block;width:12px}
  tr.open .twist{transform:rotate(90deg);color:var(--cyan)}
  .ttl{font-weight:600;color:var(--ink);line-height:1.3;max-width:430px}
  .ttl .sub{font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px}
  .pmid{font-family:var(--mono);color:var(--cyan);font-size:10px}
  .idtag{font-family:var(--mono);color:var(--faint);font-size:9px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .b-rct{background:rgba(96,165,250,.12);color:var(--blue);border-color:rgba(96,165,250,.25)}.b-rct .d{background:var(--blue)}
  .b-meta{background:rgba(167,139,250,.12);color:var(--violet);border-color:rgba(167,139,250,.25)}.b-meta .d{background:var(--violet)}
  .b-guide{background:rgba(45,212,191,.12);color:var(--teal);border-color:rgba(45,212,191,.25)}.b-guide .d{background:var(--teal)}
  .b-cohort{background:rgba(34,211,238,.12);color:var(--cyan);border-color:rgba(34,211,238,.25)}.b-cohort .d{background:var(--cyan)}
  .b-consensus{background:rgba(244,114,182,.12);color:var(--pink);border-color:rgba(244,114,182,.25)}.b-consensus .d{background:var(--pink)}

  .dec{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .dec .d{width:6px;height:6px;border-radius:50%}
  .d-apply{background:rgba(52,211,153,.14);color:var(--apply)}.d-apply .d{background:var(--apply)}
  .d-consider{background:rgba(251,191,36,.14);color:var(--consider)}.d-consider .d{background:var(--consider)}
  .d-notyet{background:rgba(251,146,60,.14);color:var(--notyet)}.d-notyet .d{background:var(--notyet)}

  .grade{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:20px}
  .grade .pips{display:flex;gap:2px}.grade .pip{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25}.grade .pip.on{opacity:1}
  .g-high{background:rgba(52,211,153,.13);color:var(--g-high)}.g-mod{background:rgba(251,191,36,.13);color:var(--g-mod)}.g-low{background:rgba(251,146,60,.13);color:var(--g-low)}.g-vlow{background:rgba(248,113,113,.13);color:var(--g-vlow)}.g-na{background:var(--surface-3);color:var(--g-na)}

  .effect{font-family:var(--mono);font-weight:700}.effect.fav{color:var(--g-high)}.effect.harm{color:var(--g-vlow)}.effect.ns{color:var(--ink-2)}
  .ci{color:var(--faint);font-family:var(--mono);font-size:10px}
  .flag{font-size:9px;font-weight:700;color:var(--g-low);border:1px solid rgba(251,146,60,.35);background:rgba(251,146,60,.1);border-radius:4px;padding:1px 5px;margin-left:6px}
  .robmini{display:flex;gap:3px}.robmini i{width:11px;height:11px;border-radius:50%}
  .rl{background:var(--g-high)}.rs{background:var(--g-mod)}.rh{background:var(--g-vlow)}

  tr.exp td{padding:0;background:var(--bg-2);border-bottom:1px solid var(--line-2)}
  .exp-in{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:0;border-top:1px solid var(--line)}
  .exp-col{padding:14px 16px;border-right:1px solid var(--line)}
  .exp-col:last-child{border-right:0}
  .exp-col h5{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .pico-r{display:grid;grid-template-columns:34px 1fr;gap:8px;margin-bottom:7px;font-size:11.5px;align-items:start}
  .pico-r .k{font-size:8.5px;font-weight:800;color:#06121f;border-radius:4px;text-align:center;padding:2px 3px;white-space:nowrap;overflow:hidden}
  .pico-r .kP{background:var(--cyan)}.pico-r .kI{background:var(--blue)}.pico-r .kC{background:var(--muted)}.pico-r .kO{background:var(--teal)}
  .pico-r .v{color:var(--ink-2)}.pico-r .v .ok{color:var(--g-high);font-size:10px;font-weight:700}.pico-r .v .no{color:var(--g-low);font-size:10px;font-weight:700}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kv .c{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .kv .c .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .kv .c .n{font-size:14px;font-weight:800;font-family:var(--mono);margin-top:2px;line-height:1.25}
  .kv .c .n.gr{color:var(--g-high)}.kv .c .n.cy{color:var(--cyan)}
  .kv .c .x{font-size:9.5px;color:var(--faint);margin-top:1px}
  .robfull{display:flex;flex-direction:column;gap:6px}
  .robfull .r{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-2)}
  .robfull .r i{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-size:8px;font-weight:800;color:#06121f}
  .kvline{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .kvline .r{display:grid;grid-template-columns:78px 1fr;gap:9px;font-size:11.5px;align-items:start}
  .kvline .r .k{color:var(--muted);font-weight:700;font-size:10px}
  .kvline .r .v{color:var(--ink-2);line-height:1.5}
  .apply{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(167,139,250,.08));border:1px solid var(--line-2);border-radius:10px;padding:11px;font-size:11.5px;color:var(--ink-2);line-height:1.55}
  .apply .h{font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .safety{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:10px;font-size:11px;color:var(--ink-2);line-height:1.5;margin-top:10px}
  .safety .h{font-size:10px;font-weight:800;color:var(--danger);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .srcs{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .srcs a{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:5px 10px;color:var(--ink-2)}
  .srcs a:hover{border-color:var(--cyan)}
  .srcs a .t{font-family:var(--mono);font-size:9px;color:#06121f;border-radius:3px;padding:1px 5px;font-weight:800}
  .srcs a .t.pm{background:var(--g-high)}.srcs a .t.doi{background:var(--blue)}.srcs a .t.url{background:var(--ink-2)}
  .reflist{font-size:10.5px;color:var(--ink-2);line-height:1.5;display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .reflist .r{padding-left:13px;text-indent:-13px}
  .empty{padding:34px;text-align:center;color:var(--muted)}

  .disclaimer{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(251,191,36,.08);border-top:1px solid rgba(251,191,36,.25);font-size:11px;color:var(--g-mod)}
  .disclaimer b{font-weight:800;color:#fcd34d}
  .disclaimer .upd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--amber)}

  /* ===================== RESPONSIVE — cân đối khi màn hẹp ===================== */
  @media (max-width:1180px){
    .kpis{grid-template-columns:repeat(4,1fr)}
    .kpis .kp{border-top:1px solid var(--line)}
    .etd-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .qv{grid-template-columns:repeat(2,1fr)}
    .etd-grid{grid-template-columns:repeat(2,1fr)}
    .exp-in{grid-template-columns:1fr}              /* chi tiết bung DỌC cho dễ đọc */
    .exp-col{border-right:0;border-bottom:1px solid var(--line)}
  }
  @media (max-width:540px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .qv{grid-template-columns:1fr}
    .etd-grid{grid-template-columns:1fr}
    .top{flex-wrap:wrap;gap:8px}
    .qbar{gap:6px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">⊕</span> EBM Copilot <span class="tag">ANALYST</span></div>
    <div class="cmd"><span class="pr">⌕ ebm&gt;</span><input id="q" placeholder="lọc: bệnh, thuốc, nhóm nguy cơ, nguồn, hành động…" oninput="render()"/><span class="kbd">⌘K</span></div>
    <div class="st"><span class="pulse"></span><span id="status">—</span></div>
  </header>

  <div class="qbar" id="qbar"></div>
  <div class="qbar" id="filters" style="border-top:0"></div>
  <div class="kpis" id="kpis"></div>
  <section class="qv" id="qv"></section>

}

    doNow=(DATA.items||[]).filter(e=>e.decision==='apply').map(e=>{
      const a=_firstSentence(e.action||''); if(_usable(a)) return a;
      const v=_firstSentence(e.vn||'');     return _usable(v)?v:'';
    }).filter(Boolean).slice(0,4);
  }
  document.getElementById('qv').innerHTML=`
    <div class="qvc concl"><div class="h">✓ Kết luận thực hành</div><p>${s.conclusion||'—'}</p></div>
    <div class="qvc do"><div class="h">➤ Nên làm</div><ul>${li(doNow)}</ul></div>
    <div class="qvc dont"><div class="h">⊘ Không nên / giới hạn</div><ul>${li(_clean(s.dontDo))}</ul></div>
    <div class="qvc flag"><div class="h">⚑ Cờ đỏ / chuyển tuyến</div><ul>${li(_clean(s.redFlags))}</ul></div>`;
  // GRADE Evidence-to-Decision (tùy chọn)
  const etd=DATA.etd, etdEl=document.getElementById('etd');
  if(etd){
    const cell=(label,val,tag)=>`<div class="etd-c"><div class="l">${label}${tag==='src'?'<span class="src">nguồn</span>':tag==='op'?'<span class="op">vận hành</span>':''}</div><div class="v">${val||'—'}</div></div>`;
    etdEl.innerHTML=`<details class="etd-d"><summary class="eh">⚖ GRADE Evidence-to-Decision <span class="note">— bấm để mở/đóng · "nguồn" = từ chứng cứ đã xác minh · "vận hành" = đánh giá của người tổng hợp</span></summary>
      <div class="etd-grid">
        ${cell('Vấn đề ưu tiên',etd.problem,'op')}
        ${cell('Lợi ích mong muốn',etd.desirable,'src')}
        ${cell('Tác hại',etd.undesirable,'src')}
        ${cell('Độ chắc chắn',etd.certainty,'src')}
        ${cell('Giá trị/ưu tiên BN',etd.values,'op')}
        ${cell('Cân bằng lợi–hại',etd.balance,'op')}
        ${cell('Nguồn lực/chi phí',etd.resources,'op')}
        ${cell('Công bằng',etd.equity,'op')}
        ${cell('Chấp nhận',etd.acceptability,'op')}
        ${cell('Khả thi',etd.feasibility,'op')}
      </div>
      ${etd.recommendation?`<div class="etd-rec"><div class="rh">➤ Khuyến cáo (đánh giá vận hành)${etd.strength?`<span class="str">${etd.strength==='strong'?'Mạnh':'Có điều kiện'}</span>`:''}</div><div class="rv">${etd.recommendation}</div></div>`:''}</details>`;
    etdEl.style.display='';
  }
  document.getElementById('verdict').textContent='✓ '+c('apply')+' áp dụng ngay · '+c('consider')+' cân nhắc · '+c('notyet')+' chưa đủ';
  buildFilters();
}
function buildFilters(){
  const it=DATA.items;
  const nSafe=it.filter(x=>x.safety).length;
  const chips=[['all','Tất cả',it.length],['apply','Áp dụng ngay',it.filter(x=>x.decision==='apply').length],
    ['consider','Cân nhắc',it.filter(x=>x.decision==='consider').length],['notyet','Chưa đủ',it.filter(x=>x.decision==='notyet').length],
    ['safety','⚑ An toàn',nSafe]];
  document.getElementById('filters').innerHTML='<span class="lab">LỌC</span>'+chips.map(c=>`<span class="fchip ${state.filter===c[0]?'on':''}" onclick="setFilter('${c[0]}')">${c[1]}<span class="ct">${c[2]}</span></span>`).join('');
}
function setFilter(f){state.filter=f;render();buildFilters();}

function filtered(){
  let arr=DATA.items.slice();
  if(state.filter==='safety') arr=arr.filter(x=>x.safety);
  else if(state.filter!=='all') arr=arr.filter(x=>x.decision===state.filter);
  if(state.q){const q=state.q.toLowerCase();arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q));}
  return arr;
}
function render(){
  state.q=document.getElementById('q').value.trim().toLowerCase();
  const arr=filtered(),rows=[];
  document.getElementById('leadcount').textContent=arr.length+' điểm chứng cứ';
  arr.forEach(e=>{
    const dm=DESIGN_META[e.design]||['b-guide',e.design||'—'],gm=GRADE_META[e.gradeLevel]||GRADE_META.na,dec=DEC_META[e.decision]||DEC_META.consider;
    const pips=Array.from({length:4},(_,i)=>`<span class="pip ${i<gm[2]?'on':''}"></span>`).join('');
    const robm=e.rob?Object.values(e.rob).map(r=>`<i class="${RM[r][0]}" title="${RM[r][1]}"></i>`).join(''):'<span style="color:var(--faint);font-size:10px">—</span>';
    rows.push(`<tr class="main-row ${state.open===e.id?'open':''}" onclick="toggle('${e.id}')">
      <td><span class="twist">▸</span></td>
      <td><div class="ttl">${e.title}${e.flag?`<span class="flag">⚑ ${e.flag}</span>`:''}<div class="sub">${e.source} · <span class="idtag">${e.id}</span>${e.pmid?` · PMID <span class="pmid">${e.pmid}</span>`:''}</div></div></td>
      <td><span class="dec ${dec[0]}"><span class="d"></span>${dec[1]}</span></td>
      <td><span class="badge ${dm[0]}"><span class="d"></span>${dm[1]}</span></td>
      <td>${effCell(e)}</td>
      <td><span class="grade ${gm[0]}"><span class="pips">${pips}</span>${gm[1]}</span></td>
      <td><div class="robmini">${robm}</div></td>
    </tr>`);
    if(state.open===e.id) rows.push(expandRow(e));
  });
  document.getElementById('rows').innerHTML=rows.join('')||`<tr><td colspan="7" class="empty">Không có điểm chứng cứ khớp bộ lọc.</td></tr>`;
}
function expandRow(e){
  const FL=e.frameLabels||{P:'P',I:'I',C:'C',O:'O'};
  const picoRows=['P','I','C','O'].map(k=>{const d=(e.pico||{})[k]||['—','match'];return `<div class="pico-r"><span class="k k${k}">${FL[k]||k}</span><span class="v">${d[0]} ${d[1]==='match'?'<span class="ok">✓</span>':'<span class="no">⚠</span>'}</span></div>`;}).join('');
  const f=e.effect;
  const robFull=e.rob?Object.keys(e.rob).map(d=>{const r=RM[e.rob[d]];return `<div class="r"><span>${d}</span><i class="${r[0]}">${r[1]}</i></div>`;}).join(''):'<div class="r" style="color:var(--faint)">RoB 2 chỉ áp dụng cho RCT — không chấm cho guideline/tổng quan.</div>';
  const forestBox=(f&&f.hr!=null)?`<h5 style="margin-top:14px">⊞ Forest (vs ngưỡng 1.0)</h5><div style="background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center">${forest(f,200,26)}<div style="font-size:9px;color:var(--faint);margin-top:4px;font-family:var(--mono)">◄ ủng hộ điều trị · ${FMIN} — 1.0 — ${FMAX} · bất lợi ►</div></div>`:'';
  return `<tr class="exp"><td colspan="7"><div class="exp-in">
    <div class="exp-col">
      <h5>◧ Đối chiếu ${e.frame||'PICO'}</h5>
      ${picoRows}
      ${forestBox}
    </div>
    <div class="exp-col">
      <h5>∑ Số liệu & thẩm định</h5>
      <div class="kv">
        <div class="c"><div class="l">Hiệu số (nguồn)</div><div class="n ${(f&&f.favors)?'gr':''}">${(f&&f.hr!=null)?f.hr.toFixed(2)+' ('+(f.ci||'')+')':(e.effectText||'—')}</div></div>
        <div class="c"><div class="l">Quần thể</div><div class="n" style="font-size:11px">${e.population||'—'}</div></div>
      </div>
      <div class="kvline"><div class="r"><span class="k">Grading nguồn</span><span class="v">${e.gradeSource||'Nguồn không cung cấp phân hạng'}</span></div></div>
      <h5>◉ Nguy cơ sai lệch (RoB 2)</h5>
      <div class="robfull">${robFull}</div>
    </div>
    <div class="exp-col">
      <h5>➤ Áp dụng lâm sàng</h5>
      <div class="apply"><div class="h">💡 Hành động</div>${e.action||'—'}</div>
      <div class="kvline" style="margin-top:10px">
        <div class="r"><span class="k">Monitoring</span><span class="v">${e.monitoring||'—'}</span></div>
        <div class="r"><span class="k">Nhóm</span><span class="v">${(e.groups||[]).map(g=>GROUP_META[g]||g).join(', ')||'—'}</span></div>
        <div class="r"><span class="k">Việt Nam</span><span class="v">${e.vn||'—'}</span></div>
      </div>
      ${e.safety?`<div class="safety"><div class="h">⚑ An toàn / chuyển tuyến</div>${e.safety}</div>`:''}
      <div class="srcs">
        ${e.pmid?`<a href="https://pubmed.ncbi.nlm.nih.gov/${e.pmid}/" target="_blank"><span class="t pm">PMID</span> ${e.pmid}</a>`:''}
        ${e.doi?`<a href="https://doi.org/${e.doi}" target="_blank"><span class="t doi">DOI</span> mở</a>`:''}
        ${e.url?`<a href="${e.url}" target="_blank"><span class="t url">URL</span> nguồn</a>`:''}
      </div>
      ${(e.references&&e.references.length)?`<div class="reflist">${e.references.map(r=>`<div class="r">${r}</div>`).join('')}</div>`:''}
    </div>
  </div></td></tr>`;
}
function toggle(id){state.open=state.open===id?null:id;render();}

renderStatic();render();
</script>
</body>
</html>
