drug_safety_rules:
  - drug: "Levothyroxine (LT4)"
    rules:
      - "Uống lúc đói, 30-60 phút trước ăn sáng (hoặc 1h trước coffee) — hấp thụ tốt nhất"
      - "Tương tác (giảm hấp thụ LT4): calcium, sắt, antacid, cholestyramine, PPI — uống cách xa ≥ 4h"
      - "Tương tác: warfarin (tăng INR); digitalis (tăng độc tính digitalis khi TSH bình thường hóa)"
      - "Người cao tuổi + bệnh tim: khởi đầu LT4 liều thấp — tăng liều quá nhanh gây rung nhĩ, đau thắt ngực"
      - "KHÔNG thay đổi hãng (biệt dược) tùy tiện — sinh khả dụng có thể khác nhau; nếu đổi → đo TSH sau 6-8 tuần"
      - "Mang thai: tăng liều LT4 ~ 20-30% ngay khi xác nhận thai; theo dõi TSH mỗi 4 tuần (tam cá nguyệt 1-2)"

  - drug: "Methimazole (Thiamazole)"
    rules:
      - "Ngừng ngay + WBC khẩn: khi bệnh nhân có sốt + đau họng (bất kỳ lúc nào trong điều trị)"
      - "Mất bạch cầu hạt: < 0.5% nhưng đe doạ tính mạng — không thể dự đoán bằng theo dõi định kỳ thường quy (khởi phát đột ngột)"
      - "Tháng 1-3 điều trị: WBC + chức năng gan mỗi 4 tuần"
      - "Mang thai (3 tháng đầu): CHUYỂN SANG PTU — methimazole gây hội chứng aplasia cutis, dị tật phôi"
      - "Mang thai (từ 3 tháng 2): có thể quay lại methimazole (PTU an toàn hơn 3 tháng đầu, methimazole an toàn hơn cho gan 3 tháng 2-3)"
      - "Không giảm liều đột ngột khi Graves đang kiểm soát tốt — theo dõi FT4 dẫn đường khi TSH còn thấp"

  - drug: "PTU (Propylthiouracil)"
    rules:
      - "Nguy cơ viêm gan nặng (có thể gây suy gan cấp): ATA KHÔNG còn khuyến cáo PTU dài hạn trừ 3 tháng đầu thai kỳ và cơn bão giáp"
      - "Xét nghiệm gan: ALT/AST baseline + mỗi 4 tuần; ngưng ngay nếu ALT > 3× ULN"
      - "Mất bạch cầu hạt: tương tự methimazole, ngưng ngay khi sốt + đau họng"
      - "Liều: 3 lần/ngày (half-life ngắn hơn methimazole)"
      - "Vasculitis liên quan ANCA: hiếm gặp, cần báo cáo nếu có triệu chứng cơ khớp + tiểu máu"

  - drug: "Beta-blocker (propranolol, atenolol) trong cường giáp"
    rules:
      - "Kiểm soát triệu chứng adrenergic nhanh (hồi hộp, run, nhịp nhanh) — không điều trị nguyên nhân"
      - "Propranolol 20-40 mg x3-4/ngày: ức chế chuyển T4→T3 ngoại biên — có thêm lợi ích trong cường giáp nặng"
      - "Ngừng từ từ khi tuyến giáp được kiểm soát — không ngưng đột ngột ở bệnh mạch vành"
      - "Suyễn nặng: tránh propranolol — dùng atenolol hoặc bisoprolol (beta1-selective)"
